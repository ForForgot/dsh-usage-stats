name: test

on:
  push:
  pull_request:

jobs:
  test:
    # The plugin targets Desktop on Windows, and its state writers use renameSync
    # plus path/DSH_HOME handling, so both families run the same suites.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the offline suites
        run: npm test
